<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--FAVICON-->
    <title>%ORG_NAME%</title>

    <meta name="description" content="%ORG_DESCRIPTION%" />
    <link rel="canonical" href="%APP_URL%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="%ORG_NAME%" />
    <meta property="og:title" content="%ORG_NAME%" />
    <meta property="og:description" content="%ORG_DESCRIPTION%" />
    <meta property="og:url" content="%APP_URL%" />
    <meta property="og:image" content="%ORG_LOGO_URL%" />
    <meta property="og:image:alt" content="%ORG_NAME% logo" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="%ORG_NAME%" />
    <meta name="twitter:description" content="%ORG_DESCRIPTION%" />
    <meta name="twitter:image" content="%ORG_LOGO_URL%" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "%ORG_NAME%",
        "url": "%APP_URL%",
        "logo": "%ORG_LOGO_URL%",
        "description": "%ORG_DESCRIPTION%",
        "sameAs": []
      }
    </script>

    <script type="module" src="./frontend.tsx" async></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
